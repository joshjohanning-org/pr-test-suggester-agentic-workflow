name: Trigger CCA Test Writer

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  trigger-cca:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Post @copilot comment on PR
        env:
          GH_TOKEN: ${{ secrets.CCA_API_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          gh pr comment "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "@copilot Review the changes in this PR and add obvious missing unit tests. \
          Follow the test patterns already in the repository. \
          Only add new test cases — do not modify existing tests. \
          Treat existing tests as contracts. \
          Run npm test to verify all tests pass before finishing."

          echo "### CCA Triggered via @copilot mention" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PR:** #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Method:** \`@copilot\` PR comment (pushes to same branch)" >> "$GITHUB_STEP_SUMMARY"
