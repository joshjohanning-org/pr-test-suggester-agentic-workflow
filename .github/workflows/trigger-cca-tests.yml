name: Trigger CCA Test Writer

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "PR target branch (e.g. main)"
        required: false
        default: "main"
      head_ref:
        description: "PR source branch to push commits to (e.g. demo/add-has-item)"
        required: true
      model:
        description: "Model to use (e.g. claude-sonnet-4.6)"
        required: false
        default: "claude-sonnet-4.6"
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  trigger-cca:
    # Only run on labeled PRs if the label is 'add-tests'
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Determine refs
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # head_ref = PR source branch (where CCA pushes commits)
            # base_ref = PR target branch (e.g. main)
            echo "head_ref=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
            echo "base_ref=${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "head_ref=${{ github.event.inputs.head_ref }}" >> "$GITHUB_OUTPUT"
            echo "base_ref=${{ github.event.inputs.base_ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Start CCA task via API
        id: cca
        env:
          GH_TOKEN: ${{ secrets.CCA_API_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          HEAD_REF="${{ steps.refs.outputs.head_ref }}"
          BASE_REF="${{ steps.refs.outputs.base_ref }}"
          MODEL="${{ github.event.inputs.model || 'claude-sonnet-4.6' }}"

          PROMPT="Review the code and add obvious missing unit tests. \
          Follow the test patterns already in the repository. \
          Only add new test cases — do not modify existing tests. \
          Treat existing tests as contracts. \
          Run npm test to verify all tests pass before finishing."

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/agents/repos/${OWNER}/${REPO}/tasks" \
            -d "$(jq -nc \
              --arg prompt "$PROMPT" \
              --arg model "$MODEL" \
              --arg base_ref "$BASE_REF" \
              --arg head_ref "$HEAD_REF" \
              '{prompt: $prompt, model: $model, base_ref: $base_ref, head_ref: $head_ref}'
            )")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: ${HTTP_CODE}"
          echo "$BODY" | jq '.'

          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::CCA task creation failed with status ${HTTP_CODE}"
            exit 1
          fi

          TASK_ID=$(echo "$BODY" | jq -r '.id')
          TASK_URL=$(echo "$BODY" | jq -r '.html_url')
          echo "✅ CCA task started: ${TASK_ID}"
          echo "🔗 ${TASK_URL}"

          echo "task_id=${TASK_ID}" >> "$GITHUB_OUTPUT"
          echo "task_url=${TASK_URL}" >> "$GITHUB_OUTPUT"

          echo "### CCA Task Started" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Task ID:** ${TASK_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** [View task](${TASK_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Base ref (PR target):** ${BASE_REF}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Head ref (push target):** ${HEAD_REF}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Model:** ${MODEL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR - task started
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TASK_URL="${{ steps.cca.outputs.task_url }}"
          HEAD_REF="${{ steps.refs.outputs.head_ref }}"
          MODEL="${{ github.event.inputs.model || 'claude-sonnet-4.6' }}"

          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "🤖 **Copilot Cloud Agent** task started to add missing unit tests.

          **Task:** [View CCA session](${TASK_URL})
          **Model:** ${MODEL}
          **Branch:** \`${HEAD_REF}\`

          CCA will push test additions directly to the \`${HEAD_REF}\` branch."

      - name: Wait for CCA task to complete
        id: wait
        env:
          GH_TOKEN: ${{ secrets.CCA_API_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          TASK_ID="${{ steps.cca.outputs.task_id }}"
          MAX_ATTEMPTS=60  # 10 minutes max (60 * 10s)

          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATE=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/agents/repos/${OWNER}/${REPO}/tasks/${TASK_ID}" \
              | jq -r '.state')

            echo "Poll ${i}/${MAX_ATTEMPTS}: state=${STATE}"

            if [ "$STATE" = "completed" ] || [ "$STATE" = "failed" ] || [ "$STATE" = "timed_out" ] || [ "$STATE" = "cancelled" ]; then
              echo "state=${STATE}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 10
          done

          echo "state=timeout" >> "$GITHUB_OUTPUT"
          echo "::warning::CCA task did not complete within 10 minutes"

      - name: Get new commits and comment summary
        if: github.event_name == 'pull_request' && steps.wait.outputs.state == 'completed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_REF="${{ steps.refs.outputs.head_ref }}"
          TASK_URL="${{ steps.cca.outputs.task_url }}"

          # Get commits by Copilot on this branch
          COMMITS=$(gh api "repos/${{ github.repository }}/commits?sha=${HEAD_REF}&per_page=10" \
            --jq '[.[] | select(.author.login == "Copilot" or .author.login == "copilot[bot]") | "- `\(.sha[:8])` \(.commit.message | split("\n")[0])"] | join("\n")')

          # Get list of test files changed
          TEST_FILES=$(gh api "repos/${{ github.repository }}/commits?sha=${HEAD_REF}&per_page=5" \
            --jq '[.[0:3][] | select(.author.login == "Copilot" or .author.login == "copilot[bot]")] | .[0].sha' \
            | xargs -I{} gh api "repos/${{ github.repository }}/commits/{}" \
            --jq '[.files[] | select(.filename | test("test|spec"; "i")) | "- `\(.filename)` (+\(.additions)/-\(.deletions))"] | join("\n")')

          BODY="✅ **Copilot Cloud Agent** finished adding tests to \`${HEAD_REF}\`.

          **Task:** [View CCA session](${TASK_URL})

          **Commits:**
          ${COMMITS}

          **Test files changed:**
          ${TEST_FILES}"

          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "${BODY}"

      - name: Comment on failure
        if: github.event_name == 'pull_request' && steps.wait.outputs.state != 'completed' && steps.wait.outputs.state != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TASK_URL="${{ steps.cca.outputs.task_url }}"
          STATE="${{ steps.wait.outputs.state }}"

          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "⚠️ **Copilot Cloud Agent** task ended with state: \`${STATE}\`

          **Task:** [View CCA session](${TASK_URL})"

